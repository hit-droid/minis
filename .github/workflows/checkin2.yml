name: Trae 第二账号签到

# 独立于主账号 checkin.yml —— 不同 Gist、不同 secrets、不同 concurrency group。
# 触发点与主账号错开（主账号 :05/:25/:45，这里用 :15/:35/:55）。
#
# 注意：这里**故意不加 continue-on-error**。
# 2026-10-18 教训：加了 continue-on-error 后，下载脚本失败也会被记成 success，
# 造成"假成功"。宁可失败报警，也不要静默。

on:
  schedule:
    - cron: "15 1 * * *"    # 北京 09:15
    - cron: "35 3 * * *"    # 北京 11:35
    - cron: "55 5 * * *"    # 北京 13:55
    - cron: "15 8 * * *"    # 北京 16:15
    - cron: "35 10 * * *"   # 北京 18:35
    - cron: "55 12 * * *"   # 北京 20:55
    - cron: "15 14 * * *"   # 北京 22:15
  workflow_dispatch:
    inputs:
      mode:
        description: "status = 只读体检 | run = 正常签到"
        required: false
        default: "status"
        type: choice
        options:
          - status
          - run

concurrency:
  group: trae-checkin-2
  cancel-in-progress: false

jobs:
  checkin2:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: 拉取脚本
        run: |
          mkdir -p trae_auto2
          URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/trae_auto2/checkin_cloud2.py"
          echo "下载: $URL"
          curl -fsSL --retry 3 --retry-delay 2 -o trae_auto2/checkin_cloud2.py "$URL"
          test -s trae_auto2/checkin_cloud2.py
          head -3 trae_auto2/checkin_cloud2.py
          echo "✔ 脚本下载成功 ($(wc -c < trae_auto2/checkin_cloud2.py) 字节)"

      - name: 执行签到
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GIST2_ID: ${{ secrets.GIST2_ID }}
          CRONJOB_API_KEY: ${{ secrets.CRONJOB_API_KEY }}
          CRONJOB_JOB2_ID: "8664362"
          RUNNER: github-actions
        run: |
          if [ "${{ github.event.inputs.mode }}" = "status" ]; then
            python3 trae_auto2/checkin_cloud2.py status
          else
            python3 trae_auto2/checkin_cloud2.py
          fi
