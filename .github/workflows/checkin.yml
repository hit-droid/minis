name: TraeWork 每日签到

# ⚠ schedule 已整段停用（2026-08-31）：云端出口为境外 IP，claim 必失败(9074)。
#   注意 `schedule:` 不能只留注释——空列表会让整个 workflow 解析失败。
#   恢复时把下面这段取消注释并放回 on: 之下：
#     schedule:
#       - cron: "5 1 * * *"    # 北京 09:05
#       - cron: "35 3 * * *"   # 北京 11:35
#       - cron: "5 7 * * *"    # 北京 15:05
#       - cron: "40 13 * * *"  # 北京 21:40
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry = 只取证出口IP，绝不签到 | run = 正常签到"
        required: false
        default: "dry"
        type: choice
        options:
          - dry
          - run

concurrency:
  group: trae-checkin
  cancel-in-progress: false

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 执行
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GIST_ID: ${{ secrets.GIST_ID }}
          TRAE_CRED: ${{ secrets.TRAE_CRED }}
          RUNNER: github-actions
        run: |
          if [ "${{ github.event.inputs.mode }}" = "run" ]; then
            python trae_auto/checkin.py || python trae_auto/checkin.py
          else
            python trae_auto/checkin.py dry
          fi
