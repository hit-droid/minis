name: TraeWork 每日签到

# 2026-08-31 更新：经本地沙箱实测确认，code 9074 是真限流，不是地域风控
# （国内 IP 175.5.52.228 / Chinanet 也 6 次全 9074）。
# 但 Actions 跑在 Azure 美国 IP 段（4.246.62.229），与本地/国内家用
# IP 段分属不同限流桶，多段错峰 = 多个独立尝试 + 不同计数器，叠加更稳。
# 策略：8 个时间点错峰，每点失败时 2 分钟后自动重试一次（双保险）。
# 记账本（status.json）已经做幂等，不会重复领。
on:
  schedule:
    - cron: "5 1 * * *"    # 北京 09:05
    - cron: "45 2 * * *"   # 北京 10:45
    - cron: "25 4 * * *"   # 北京 12:25
    - cron: "5 6 * * *"    # 北京 14:05
    - cron: "45 7 * * *"   # 北京 15:45
    - cron: "25 9 * * *"   # 北京 17:25
    - cron: "0 12 * * *"   # 北京 20:00
    - cron: "30 14 * * *"  # 北京 22:30
  workflow_dispatch:
    inputs:
      mode:
        description: "dry = 只取证出口IP，绝不签到 | run = 正常签到"
        required: false
        default: "dry"
        type: choice
        options:
          - dry
          - run

concurrency:
  group: trae-checkin
  cancel-in-progress: false

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 执行（首次）
        id: first
        continue-on-error: true
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GIST_ID: ${{ secrets.GIST_ID }}
          TRAE_CRED: ${{ secrets.TRAE_CRED }}
          TRAE_PROXY: ${{ secrets.TRAE_PROXY }}
          RUNNER: github-actions
        run: |
          if [ -n "$TRAE_PROXY" ]; then
            export http_proxy="$TRAE_PROXY" https_proxy="$TRAE_PROXY"
            export no_proxy="api.github.com,gist.githubusercontent.com,raw.githubusercontent.com"
            export NO_PROXY="$no_proxy"
            echo "已启用代理出口（GitHub API 直连）"
          else
            echo "未配置 TRAE_PROXY —— 直连美国 IP 段，仍可签（限流独立桶）"
          fi
          if [ "${{ github.event.inputs.mode }}" = "run" ]; then
            python trae_auto/checkin.py
          else
            python trae_auto/checkin.py dry
          fi

      - name: 失败重试（仅当首次失败）
        if: steps.first.outcome == 'failure' && github.event_name == 'schedule'
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GIST_ID: ${{ secrets.GIST_ID }}
          TRAE_CRED: ${{ secrets.TRAE_CRED }}
          TRAE_PROXY: ${{ secrets.TRAE_PROXY }}
          RUNNER: github-actions-retry
        run: |
          echo "首次失败，2 分钟后重试（限流窗口可能已冷）"
          sleep 120
          if [ -n "$TRAE_PROXY" ]; then
            export http_proxy="$TRAE_PROXY" https_proxy="$TRAE_PROXY"
            export no_proxy="api.github.com,gist.githubusercontent.com,raw.githubusercontent.com"
            export NO_PROXY="$no_proxy"
          fi
          python trae_auto/checkin.py
