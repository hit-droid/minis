name: TraeWork 每日签到

# 2026-09-05 恢复定时：9074 根因是 deviceId 被风控标记（换号即解），
# 不是境外 IP —— 云端有真实战斗力了，schedule 恢复。
# 8 个错峰点（北京时间），跨 09:05–22:30 覆盖全天，任一成功即幂等收工。
on:
  schedule:
    - cron: "5 1 * * *"     # 北京 09:05
    - cron: "45 2 * * *"    # 北京 10:45
    - cron: "25 4 * * *"    # 北京 12:25
    - cron: "5 6 * * *"     # 北京 14:05
    - cron: "45 7 * * *"    # 北京 15:45
    - cron: "25 9 * * *"    # 北京 17:25
    - cron: "0 12 * * *"    # 北京 20:00
    - cron: "30 14 * * *"   # 北京 22:30
  workflow_dispatch:
    inputs:
      mode:
        description: "dry = 只取证出口IP，绝不签到 | run = 正常签到"
        required: false
        default: "dry"
        type: choice
        options:
          - dry
          - run
      keepalive:
        description: "keepalive = 空提交防 60 天无活动自动禁用 schedule"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

concurrency:
  group: trae-checkin
  cancel-in-progress: false

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 执行（失败 2 分钟后自动重试一次）
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GIST_ID: ${{ secrets.GIST_ID }}
          TRAE_CRED: ${{ secrets.TRAE_CRED }}
          TRAE_PROXY: ${{ secrets.TRAE_PROXY }}
          RUNNER: github-actions
        run: |
          # 可选代理出口（未配置则直连）。GitHub API 永远直连。
          if [ -n "$TRAE_PROXY" ]; then
            export http_proxy="$TRAE_PROXY" https_proxy="$TRAE_PROXY"
            export no_proxy="api.github.com,gist.githubusercontent.com,raw.githubusercontent.com"
            export NO_PROXY="$no_proxy"
            echo "已启用代理出口（GitHub API 直连）"
          else
            echo "未配置 TRAE_PROXY —— 直连（自愈换号兜底 9074）"
          fi
          # schedule 事件没有 inputs.mode，默认视为 run；手动 dispatch 保持 dry 缺省
          MODE="${{ github.event.inputs.mode }}"
          [ -z "$MODE" ] && MODE=run
          echo "本次 mode=$MODE"
          run_once() {
            if [ "$MODE" = "run" ]; then
              python trae_auto/checkin.py
            else
              python trae_auto/checkin.py dry
            fi
          }
          if run_once; then
            exit 0
          fi
          echo "首次尝试失败，等待 120 秒后重试一次（避免旧版『串联立即重试』覆盖有效结果的坑）"
          sleep 120
          run_once

      - name: 月度 keepalive（防 60 天无活动禁 schedule）
        if: github.event.inputs.keepalive == 'true'
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git config user.name "checkin-bot"
          git config user.email "checkin-bot@users.noreply.github.com"
          git pull --rebase origin ${GITHUB_REF_NAME} || true
          date -u +"keepalive %Y-%m-%dT%H:%M:%SZ" >> .keepalive
          git add .keepalive
          git commit -m "chore: keepalive $(date -u +%F)" || echo "nothing to commit"
          git push origin ${GITHUB_REF_NAME}
